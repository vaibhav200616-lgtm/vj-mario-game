<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MY MARIO (VJ WORLD)</title>
  
  <!-- Phaser 3 Engine -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      touch-action: none;
      font-family: Arial, sans-serif;
    }
    #game-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      outline: none;
      max-width: 100%;
      max-height: 100%;
    }

    /* Rotate Device Alert for Portrait */
    #rotate-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #0b0f19;
      color: #ffcc00;
      z-index: 100000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    #rotate-warning h2 { font-size: 22px; margin-bottom: 8px; font-weight: bold; }
    #rotate-warning p { color: #ffffff; font-size: 14px; }

    @media screen and (orientation: portrait) {
      #rotate-warning { display: flex; }
    }
  </style>
</head>
<body>

  <div id="rotate-warning">
    <h2>📱 PLEASE ROTATE YOUR PHONE</h2>
    <p>Landscape mode is required for full screen gameplay.</p>
  </div>

  <div id="game-container"></div>

  <script src="game.js"></script>
</body>
</html>
