<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MY MARIO (VJ WORLD)</title>
  
  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      touch-action: none;
      font-family: Arial, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      outline: none;
      max-width: 100%;
      max-height: 100%;
    }

    /* --- MOBILE TOUCH CONTROLS --- */
    .touch-ui-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 16px 24px;
    }

    /* Left side D-Pad */
    .dpad-container {
      display: grid;
      grid-template-columns: 60px 60px 60px;
      grid-template-rows: 54px 54px;
      gap: 6px;
      pointer-events: auto;
    }

    /* Right side Action Buttons */
    .action-container {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      pointer-events: auto;
    }

    .t-btn {
      width: 60px;
      height: 54px;
      background: rgba(255, 255, 255, 0.22);
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-radius: 12px;
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .t-btn:active, .t-btn.active {
      background: rgba(255, 204, 0, 0.65) !important;
      border-color: #ffd700 !important;
      transform: scale(0.92);
    }

    /* Action Buttons Circle shape */
    .t-btn-action {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      font-size: 26px;
    }

    .btn-duck {
      grid-column: 2;
      grid-row: 2;
      background: rgba(120, 120, 120, 0.35);
    }
    .btn-left {
      grid-column: 1;
      grid-row: 2;
    }
    .btn-right {
      grid-column: 3;
      grid-row: 2;
    }
    .btn-shoot {
      background: rgba(255, 68, 68, 0.38);
      border-color: rgba(255, 100, 100, 0.6);
    }
    .btn-jump {
      background: rgba(0, 230, 118, 0.38);
      border-color: rgba(0, 255, 150, 0.6);
    }

    /* Rotate Device Prompt for Portrait Mode */
    #rotate-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #0b0f19;
      color: #ffcc00;
      z-index: 100000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    #rotate-warning h2 { font-size: 22px; margin-bottom: 8px; }
    #rotate-warning p { color: #fff; font-size: 14px; }

    @media screen and (orientation: portrait) {
      #rotate-warning { display: flex; }
    }

    /* Hide touch overlay strictly on Laptop/Desktop */
    @media (hover: hover) and (pointer: fine) {
      .touch-ui-overlay { display: none !important; }
    }
  </style>
</head>
<body>

  <div id="rotate-warning">
    <h2>📱 PLEASE ROTATE YOUR PHONE</h2>
    <p>Landscape mode is required for full screen gameplay.</p>
  </div>

  <div id="game-container"></div>

  <!-- Multi-Touch UI -->
  <div class="touch-ui-overlay">
    <!-- Directional Controls -->
    <div class="dpad-container">
      <div class="t-btn btn-left" id="btn-left">◀</div>
      <div class="t-btn btn-duck" id="btn-down">▼</div>
      <div class="t-btn btn-right" id="btn-right">▶</div>
    </div>

    <!-- Actions (Jump & Shoot) -->
    <div class="action-container">
      <div class="t-btn t-btn-action btn-shoot" id="btn-shoot">🏹</div>
      <div class="t-btn t-btn-action btn-jump" id="btn-jump">▲</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
