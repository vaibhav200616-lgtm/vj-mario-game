<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MY MARIO (VJ WORLD)</title>
  
  <!-- Phaser 3 Engine -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      touch-action: none;
      font-family: Arial, sans-serif;
    }
    #game-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      outline: none;
      max-width: 100%;
      max-height: 100%;
    }

    /* Floating Universal Fullscreen Toggle */
    #global-fs-btn {
      position: fixed;
      top: 12px;
      right: 14px;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid #ffd700;
      color: #ffd700;
      font-size: 11px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #global-fs-btn:active {
      background: rgba(255, 215, 0, 0.3);
      transform: scale(0.92);
    }

    /* Rotate Device Prompt for Portrait */
    #rotate-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #0b0f19;
      color: #ffcc00;
      z-index: 1000000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    #rotate-warning h2 { font-size: 22px; margin-bottom: 8px; font-weight: bold; }
    #rotate-warning p { color: #ffffff; font-size: 14px; }

    @media screen and (orientation: portrait) {
      #rotate-warning { display: flex; }
    }

    /* Hide fullscreen toggle on mouse devices */
    @media (hover: hover) and (pointer: fine) {
      #global-fs-btn { display: none !important; }
    }
  </style>
</head>
<body>

  <div id="rotate-warning">
    <h2>📱 PLEASE ROTATE YOUR PHONE</h2>
    <p>Landscape mode is required for full screen gameplay.</p>
  </div>

  <button id="global-fs-btn">⛶ FULLSCREEN</button>

  <div id="game-container"></div>

  <script>
    const fsBtn = document.getElementById('global-fs-btn');
    const toggleFS = () => {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    };
    if (fsBtn) {
      fsBtn.addEventListener('click', toggleFS);
      fsBtn.addEventListener('touchend', (e) => { e.preventDefault(); toggleFS(); });
    }
  </script>
  <script src="game.js"></script>
</body>
</html>
